<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס יצירת קשר</title>
    <script src="https://.cloudflare.com//libs/supabase//supabase..js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            direction: rtl;
        }

        .form-container {
            max-width: 640px;
            margin: 0 auto;
        }

        .form-header {
            background: white;
            border-radius: 8px 8px 0 0;
            padding: 24px;
            border-top: 10px solid #673ab7;
        }

        .form-title {
            font-size: 32px;
            color: #202124;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .form-description {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 16px;
        }

        .whatsapp-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #25D366;
            color: white;
            padding: 10px 20px;
            border-radius: 24px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s;
        }

        .whatsapp-link:hover {
            background: #20BA5A;
        }

        .whatsapp-icon {
            font-size: 20px;
        }

        .form-body {
            background: white;
            border-radius: 0 0 8px 8px;
            margin-top: 12px;
        }

        .question-block {
            padding: 24px;
            border-bottom: 1px solid #e0e0e0;
        }

        .question-block:last-child {
            border-bottom: none;
        }

        .question-label {
            font-size: 16px;
            color: #202124;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .required {
            color: #d93025;
            margin-right: 4px;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: none;
            border-bottom: 1px solid #dadce0;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-bottom: 2px solid #673ab7;
        }

        .textarea-field {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            outline: none;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.2s;
        }

        .textarea-field:focus {
            border-color: #673ab7;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            margin-left: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .radio-option label {
            cursor: pointer;
            font-size: 14px;
            color: #202124;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-option input[type="checkbox"] {
            margin-left: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .checkbox-option label {
            cursor: pointer;
            font-size: 14px;
            color: #202124;
        }

        .submit-section {
            padding: 24px;
            display: flex;
            gap: 12px;
        }

        .submit-btn {
            background-color: #673ab7;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #5e35b1;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .clear-btn {
            background-color: transparent;
            color: #673ab7;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .clear-btn:hover {
            background-color: #f3e5f5;
        }

        .success-message, .error-message {
            background: white;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            display: none;
        }

        .success-message.show, .error-message.show {
            display: block;
        }

        .success-icon {
            font-size: 64px;
            color: #673ab7;
            margin-bottom: 16px;
        }

        .error-icon {
            font-size: 64px;
            color: #d93025;
            margin-bottom: 16px;
        }

        .success-title, .error-title {
            font-size: 24px;
            color: #202124;
            margin-bottom: 8px;
        }

        .success-text, .error-text {
            font-size: 14px;
            color: #5f6368;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1 class="form-title">טופס משוב</h1>
            <p class="form-description">אנא מלאו את הטופס למטה. ניצור איתכם קשר בקרוב.</p>
            <a href="https://wa.me/message/LANSOHSRDN6JM1" target="_blank" class="whatsapp-link">
                <span class="whatsapp-icon">📱</span>
                כתוב ב-WhatsApp
            </a>
        </div>

        <form id="mainForm" class="form-body">
            <div class="question-block">
                <div class="question-label">
                    שמך<span class="required">*</span>
                </div>
                <input type="text" class="input-field" name="name" placeholder="הזן את שמך" required>
            </div>

            <div class="question-block">
                <div class="question-label">
                    דוא"ל<span class="required">*</span>
                </div>
                <input type="email" class="input-field" name="email" placeholder="example@email.com" required>
            </div>

            <div class="question-block">
                <div class="question-label">
                    טלפון
                </div>
                <input type="tel" class="input-field" name="phone" placeholder="+972 (___) ___-__-__">
            </div>

            <div class="question-block">
                <div class="question-label">
                    איך שמעת עלינו?<span class="required">*</span>
                </div>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" name="source" id="search" value="מנוע חיפוש" required>
                        <label for="search">מנוע חיפוש</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="source" id="social" value="רשתות חברתיות">
                        <label for="social">רשתות חברתיות</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="source" id="friend" value="מחברים">
                        <label for="friend">מחברים</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="source" id="ad" value="פרסומת">
                        <label for="ad">פרסומת</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="source" id="other" value="אחר">
                        <label for="other">אחר</label>
                    </div>
                </div>
            </div>

            <div class="question-block">
                <div class="question-label">
                    מה מעניין אותך?
                </div>
                <div class="checkbox-group">
                    <div class="checkbox-option">
                        <input type="checkbox" name="interest" id="services" value="שירותים">
                        <label for="services">שירותים</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" name="interest" id="products" value="מוצרים">
                        <label for="products">מוצרים</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" name="interest" id="partnership" value="שותפות">
                        <label for="partnership">שותפות</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" name="interest" id="support" value="תמיכה">
                        <label for="support">תמיכה</label>
                    </div>
                </div>
            </div>

            <div class="question-block">
                <div class="question-label">
                    ההודעה שלך<span class="required">*</span>
                </div>
                <textarea class="textarea-field" name="message" placeholder="ספר לנו יותר..." required></textarea>
            </div>

            <div class="submit-section">
                <button type="submit" class="submit-btn" id="submitBtn">שלח</button>
                <button type="button" class="clear-btn" onclick="clearForm()">נקה טופס</button>
            </div>
        </form>

        <div id="successMessage" class="success-message">
            <div class="success-icon">✓</div>
            <h2 class="success-title">תודה!</h2>
            <p class="success-text">הטופס שלך נשלח בהצלחה. ניצור איתך קשר בקרוב.</p>
        </div>

        <div id="errorMessage" class="error-message">
            <div class="error-icon">✕</div>
            <h2 class="error-title">שגיאה</h2>
            <p class="error-text" id="errorText">אירעה שגיאה בשליחת הטופס. נסה שוב.</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://';
        const SUPABASE_ANON_KEY = ''
        
        // Инициализация Supabase клиента
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('mainForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> שולח...';
            
            try {
                const formData = new FormData(form);
                
                const interests = [];
                formData.getAll('interest').forEach(value => interests.push(value));
                
                const data = {
                    name: formData.get('name'),
                    email: formData.get('email'),
                    phone: formData.get('phone') || null,
                    source: formData.get('source'),
                    interests: interests.join(', '),
                    message: formData.get('message'),
                    created_at: new Date().toISOString()
                };
                
                const { error } = await supabase
                    .from('form_submissions') // Название таблицы
                    .insert([data]);
                
                if (error) throw error;
            
                form.style.display = 'none';
                successMessage.classList.add('show');
                
                setTimeout(() => {
                    form.style.display = 'block';
                    successMessage.classList.remove('show');
                    form.reset();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'שלח';
                }, 3000);
                
            } catch (error) {
                console.error('שגיאה:', error);
                
                form.style.display = 'none';
                errorText.textContent = error.message || 'אירעה שגיאה בשליחת הטופס. נסה שוב.';
                errorMessage.classList.add('show');
                
                setTimeout(() => {
                    form.style.display = 'block';
                    errorMessage.classList.remove('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'שלח';
                }, 3000);
            }
        });

        function clearForm() {
            form.reset();
        }
    </script>
</body>
</html>
